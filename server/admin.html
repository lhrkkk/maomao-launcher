<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>经营后台 · 猫猫 Token</title>
<style>
  :root { --bg1:#f7f3ee; --bg2:#efe7de; --card:#fff; --dark:#31283a; --muted:#857f95; --orange:#ff8d6b; --line:#ece7ee; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(160deg,var(--bg1),var(--bg2)); color:var(--dark); min-height:100vh; }
  .wrap { max-width:1080px; margin:0 auto; padding:34px 18px 60px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .brand h1 { font-size:22px; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(34,32,51,.06); margin-bottom:14px; }
  .tabs { display:flex; gap:4px; background:#efeaf1; border-radius:11px; padding:3px; width:max-content; margin-bottom:16px; }
  .tabs button { border:0; background:transparent; border-radius:8px; padding:8px 18px; font-size:13px; font-weight:800; color:#857f95; cursor:pointer; }
  .tabs button.on { background:#fff; color:#312b4f; box-shadow:0 1px 5px rgba(49,43,79,.18); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-size:11px; font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:10px; border-bottom:1px solid #f4f0f5; vertical-align:middle; }
  tr:hover td { background:#fbf9fc; }
  .badge { font-size:11px; padding:2px 9px; border-radius:99px; white-space:nowrap; }
  .b-on { background:#e5f6ec; color:#1d7a4a; }
  .b-off { background:#fdeae4; color:#b04a2f; }
  .b-auto { background:#fff4dc; color:#9a6a12; }
  .btn { border:0; border-radius:9px; height:32px; padding:0 13px; font-size:12px; font-weight:800; cursor:pointer; background:var(--dark); color:#fff; white-space:nowrap; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost { background:#f1eef3; color:var(--dark); }
  .btn.warn { background:#fdeae4; color:#b04a2f; }
  .ops { display:flex; gap:6px; }
  .loginrow { display:flex; gap:8px; flex-wrap:wrap; }
  .loginrow input { flex:1; min-width:130px; height:40px; border:1px solid var(--line); border-radius:10px; padding:0 12px; font-size:14px; }
  .msg { text-align:center; color:var(--muted); padding:26px 0; font-size:13px; }
  .err { color:#b04a2f; }
  .who { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:13px; color:var(--muted); }
  .models-cell { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#6b6577; font-size:12px; }
  .editor { background:#fbf9fc; border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0 4px; }
  .editor textarea { width:100%; min-height:88px; border:1px solid var(--line); border-radius:9px; padding:10px; font:12px ui-monospace,monospace; resize:vertical; }
  .editor .row { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .hint { font-size:12px; color:var(--muted); line-height:1.7; }
  .client-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .client-card { border:1px solid var(--line); border-radius:13px; padding:15px; background:#fdfcfb; }
  .client-card h3 { font-size:13px; margin-bottom:3px; }
  .client-card .hint { font-size:11px; margin-bottom:9px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px; }
  .chip { display:inline-flex; align-items:center; gap:5px; background:#f1eef3; border-radius:99px; padding:3px 6px 3px 11px; font-size:12px; font-weight:700; }
  .chip.x { cursor:pointer; color:#b04a2f; font-weight:900; padding:0 6px; }
  .chip input.adder { border:1px dashed #d8d2dc; border-radius:99px; padding:3px 11px; font-size:12px; width:150px; outline:none; background:#fff; }
  .selrow { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:4px; }
  .selrow select { border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:12px; background:#fff; }
  .savebar { display:flex; justify-content:flex-end; margin-top:16px; gap:8px; }
  .toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--dark); color:#fff; padding:10px 18px; border-radius:99px; font-size:13px; opacity:0; transition:.25s; z-index:99; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span style="font-size:24px">🐾</span><h1>经营后台</h1></div>
  <div class="sub">渠道与客户端模型配置 · 仅管理员</div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const app = $("app");
  let TK = null;
  const toast = (t, bad) => { const el = $("toast"); el.textContent = t; el.style.background = bad ? "#b04a2f" : "#31283a"; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2400); };

  function findToken() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i); let v; try { v = localStorage.getItem(k); } catch (_) { continue; }
        if (!v || (v.indexOf("accessToken") === -1 && v.indexOf("access_token") === -1)) continue;
        try { const o = JSON.parse(v); const t = o.accessToken || o.access_token || (o.data && o.data.access_token); if (t) return t; } catch (_) {}
      }
    } catch (_) {}
    return null;
  }
  async function ensureToken(force) {
    if (!force && TK) return TK;
    if (!force) { TK = findToken(); if (TK) return TK; }
    try {
      const r = await fetch("/api/user/auth/refresh", { method: "POST", credentials: "same-origin" });
      const d = await r.json().catch(() => ({}));
      if (d.success && d.data && d.data.access_token) TK = d.data.access_token;
    } catch (_) {}
    return TK;
  }
  const api = async (u, opt = {}, retried) => {
    const t = await ensureToken();
    const r = await fetch(u, { credentials: "same-origin", ...opt, headers: { "Content-Type": "application/json", ...(t ? { Authorization: "Bearer " + t } : {}), ...(opt.headers || {}) } });
    if (r.status === 401 && !retried) { await ensureToken(true); return api(u, opt, true); }
    return r.json().catch(() => ({ success: false, message: "网络错误" }));
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const usd = (q) => "$" + ((q || 0) / 500000).toFixed(2);

  // ---------- 登录 ----------
  const TS_KEY = "0x4AAAAAAFWAGUXaAA_a-Rqt";
  let tsToken = "";
  function mountTs() {
    const box = $("tsBox");
    if (!box || box.childElementCount) return;
    const render = () => { try { turnstile.render("#tsBox", { sitekey: TS_KEY, callback: (t) => tsToken = t, "expired-callback": () => tsToken = "", "error-callback": () => tsToken = "" }); } catch (_) {} };
    if (window.turnstile) return render();
    const sc = document.createElement("script");
    sc.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    sc.async = true; sc.onload = render; document.head.appendChild(sc);
  }
  function renderLogin() {
    app.innerHTML = "";
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<div class="loginrow">
      <input id="u" placeholder="管理员用户名">
      <input id="p" type="password" placeholder="密码">
      <button class="btn" id="go" style="height:40px">登录</button>
    </div><div class="hint" style="margin-top:10px">与站点同账号,需管理员权限。</div>
    <div id="tsBox" style="display:flex;justify-content:center;margin-top:12px"></div>`;
    app.appendChild(card);
    const go = async () => {
      const u = card.querySelector("#u").value.trim(), p = card.querySelector("#p").value;
      if (!u || !p) return;
      const btn = card.querySelector("#go"); btn.disabled = true; btn.textContent = "登录中…";
      const r = await fetch("/api/user/login?turnstile=" + encodeURIComponent(tsToken), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: u, password: p }) }).then((x) => x.json()).catch(() => ({}));
      tsToken = ""; try { turnstile && turnstile.reset(); } catch (_) {}
      const d = r && r.data || {};
      if (r.success && d.access_token) {
        TK = d.access_token;
        try { localStorage.setItem("mmAdminAt", TK); } catch (_) {}
        boot(); return;
      }
      toast(r.message || "登录失败", 1); btn.disabled = false; btn.textContent = "登录";
    };
    card.querySelector("#go").onclick = go;
    card.querySelectorAll("input").forEach((i) => i.onkeydown = (e) => e.key === "Enter" && go());
    mountTs();
  }

  // ---------- 框架 ----------
  let tab = "dash";
  function renderFrame(who) {
    app.innerHTML = "";
    const top = document.createElement("div"); top.className = "who";
    top.innerHTML = `<span>✓ ${esc(who)}</span>`;
    const out = document.createElement("button"); out.className = "btn ghost"; out.textContent = "退出";
    out.onclick = () => { TK = null; try { localStorage.removeItem("mmAdminAt"); } catch (_) {} renderLogin(); };
    top.appendChild(out); app.appendChild(top);

    const tabs = document.createElement("div"); tabs.className = "tabs";
    const mk = (key, label) => { const b = document.createElement("button"); b.textContent = label; b.className = tab === key ? "on" : ""; b.onclick = () => { tab = key; renderFrame(who); }; tabs.appendChild(b); };
    mk("dash", "看板"); mk("wb", "分组"); mk("users", "用户"); mk("channels", "上游渠道"); mk("pricing", "模型定价"); mk("models", "客户端模型配置");
    app.appendChild(tabs);

    const body = document.createElement("div"); body.id = "tabbody"; app.appendChild(body);
    if (tab === "dash") loadDash(body); else if (tab === "wb") loadWorkbench(body); else if (tab === "users") loadUsers(body); else if (tab === "channels") loadChannels(body); else if (tab === "pricing") loadPricing(body); else loadModelCfg(body);
  }
  async function boot() {
    await ensureToken(true); // 先静默续期,避免拿过期凭证请求在控制台报 401
    const me = await api("/api/user/self");
    if (!me.success || !(me.data && me.data.role >= 10)) { toast("需要管理员权限", 1); renderLogin(); return; }
    renderFrame(me.data.display_name || me.data.username);
  }

  // ---------- 模型定价 ----------
  let pricingSnap = null;
  async function loadPricing(box) {
    box.innerHTML = `<div class="msg">加载中…</div>`;
    const d = await api("/api/option/model_pricing");
    if (!d.success) { box.innerHTML = `<div class="msg err">${esc(d.message || "加载失败")}</div>`; return; }
    pricingSnap = d.data || {};
    // 全量价目:已配置定价 ∪ 全部启用渠道的模型(未配置 = 未定价,按默认倍率计)
    const cfgMap = {};
    (pricingSnap.entries || []).forEach((e) => cfgMap[e.model_name] = e);
    const enabled = await api("/api/channel/models_enabled");
    const names = new Set(Object.keys(cfgMap));
    if (enabled.success && Array.isArray(enabled.data)) enabled.data.forEach((m) => names.add(m));
    // 模型 → 提供它的渠道分组(取启用渠道)
    const modelGroups = {};
    const chs = await api("/api/channel/?p=1&page_size=100");
    if (chs.success) {
      const list = chs.data && (chs.data.items || chs.data) || [];
      list.filter((c) => c.status === 1).forEach((c) => {
        String(c.models || "").split(",").map((x) => x.trim()).filter(Boolean).forEach((m) => {
          modelGroups[m] = modelGroups[m] || new Set();
          String(c.group || "default").split(",").map((x) => x.trim()).filter(Boolean).forEach((g) => modelGroups[m].add(g));
        });
      });
    }
    const entries = [...names].sort((a, b) => String(a).localeCompare(String(b))).map((n) => cfgMap[n] || { model_name: n, version: pricingSnap.empty_version, configured: {} });
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `
      <div class="hint" style="margin-bottom:10px">列表 = 全部启用渠道的模型;显示 — 的未单独定价,按默认倍率计费。倍率制:<b>模型倍率</b> 1 = $0.002/千 token,补全价 = 模型倍率 × <b>补全倍率</b>;<b>固定价格</b>($/次)设置后优先于倍率。留空 = 清除该项(回到默认)。改动即时生效。</div>
      <input id="pkw" placeholder="过滤模型名…" style="height:34px;width:220px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:13px;margin-bottom:10px"><table><thead><tr><th>分组</th><th>模型</th><th>模型倍率</th><th>补全倍率</th><th>输入价 $/1M</th><th>输出价 $/1M</th><th>固定价格 $/次</th><th style="text-align:right">操作</th></tr></thead><tbody id="prows"></tbody></table>
      <div id="pedit"></div>
      <div class="editor" style="margin-top:14px">
        <div class="hint">新增模型定价</div>
        <div class="row">
          <input id="pnew-name" placeholder="模型名(须与渠道模型名一致)" style="flex:1;min-width:200px;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:13px">
          <button class="btn" id="pnew-add">配置</button>
        </div>
      </div>`;
    if (box.querySelector(".msg")) box.innerHTML = ""; // 清掉"加载中"占位
    box.appendChild(card);
    const tb = card.querySelector("#prows");
    if (!entries.length) tb.innerHTML = `<tr><td colspan="5" class="msg">没有可用模型</td></tr>`;
    entries.forEach((e) => {
      const c = e.configured || {};
      const fmt = (v) => v == null ? "—" : (typeof v === "number" ? (v >= 100 ? Math.round(v) : +v.toFixed(4)) : v);
      const tr = document.createElement("tr");
      const mr = typeof c.ModelRatio === "number" ? c.ModelRatio : null;
      const cr = typeof c.CompletionRatio === "number" ? c.CompletionRatio : null;
      const inUsd = mr != null ? mr * 2 : null;
      const outUsd = mr != null ? inUsd * (cr != null ? cr : 1) : null;
      const usdFmt = (v) => v == null ? "—" : "$" + (v >= 0.1 ? v.toFixed(2) : v.toPrecision(2));
      tr.innerHTML = `<td style="font-size:12px;color:#6b6577">${esc([...(modelGroups[e.model_name] || [])].join(",") || "—")}</td>
        <td><b>${esc(e.model_name)}</b></td>
        <td>${fmt(c.ModelRatio)}</td><td>${fmt(c.CompletionRatio)}</td>
        <td>${usdFmt(inUsd)}</td><td>${usdFmt(outUsd)}</td><td>${fmt(c.ModelPrice)}</td>
        <td><div class="ops" style="justify-content:flex-end"><button class="btn ghost p-edit">编辑</button></div></td>`;
      tr.querySelector(".p-edit").onclick = () => editPricing(e);
      tr.dataset.q = String(e.model_name).toLowerCase();
      tb.appendChild(tr);
    });
    filterRows("pkw", "prows");
    card.querySelector("#pnew-add").onclick = () => editPricing({ model_name: card.querySelector("#pnew-name").value.trim(), version: pricingSnap.empty_version, configured: {} });
  }

  function editPricing(entry) {
    if (!entry.model_name) { toast("请先填模型名", 1); return; }
    const ed = document.getElementById("pedit") || document.createElement("div");
    const c = entry.configured || {};
    const mr = typeof c.ModelRatio === "number" ? c.ModelRatio : null;
    const cr = typeof c.CompletionRatio === "number" ? c.CompletionRatio : null;
    const inP = mr != null ? +(mr * 2).toFixed(4) : "";
    const outP = mr != null ? +(mr * 2 * (cr != null ? cr : 1)).toFixed(4) : "";
    const inp = (id, label, cur, w) => `<label style="font-size:12px;color:var(--muted)">${label}<input id="${id}" value="${cur === "" ? "" : cur}" placeholder="留空=清除" style="width:${w || 120}px;margin-left:6px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:13px"></label>`;
    ed.innerHTML = `<div class="editor">
      <div class="hint">「${esc(entry.model_name)}」 直接按单价定价($/1M tokens),保存时自动换算倍率</div>
      <div class="row">${inp("pv-in", "输入价 $/1M", inP)}${inp("pv-out", "输出价 $/1M", outP, 130)}${inp("pv-p", "固定价格$/次(按次模型用)", c.ModelPrice ?? "", 190)}</div>
      <div class="row">
        <button class="btn" id="pv-save">保存</button>
        <button class="btn ghost" id="pv-cancel">取消</button>
        <span class="hint" id="pv-calc"></span>
      </div>
    </div>`;
    ed.scrollIntoView({ behavior: "smooth", block: "nearest" });
    const updCalc = () => {
      const num = (id) => { const v = ed.querySelector(id).value.trim(); return v === "" ? null : Number(v); };
      const el = ed.querySelector("#pv-calc");
      const a = num("#pv-in"), b = num("#pv-out");
      if (a == null) { el.textContent = ""; return; }
      el.textContent = `倍率:模型 ${+(a / 2).toFixed(4)} · 补全 ${b != null ? +(b / a).toFixed(4) : "—"}`;
    };
    ["#pv-in", "#pv-out"].forEach((id) => ed.querySelector(id).addEventListener("input", updCalc));
    updCalc();
    ed.querySelector("#pv-cancel").onclick = () => ed.innerHTML = "";
    ed.querySelector("#pv-save").onclick = async () => {
      const num = (id) => { const v = ed.querySelector(id).value.trim(); return v === "" ? null : Number(v); };
      const inU = num("#pv-in"), outU = num("#pv-out"), price = num("#pv-p");
      if (inU == null && outU == null && price == null) { toast("至少填一项", 1); return; }
      if ([inU, outU, price].some((v) => v != null && (isNaN(v) || v < 0))) { toast("数值无效", 1); return; }
      if (inU != null && inU <= 0 && outU != null) { toast("输出价换算需要输入价大于 0", 1); return; }
      const pricing = {};
      if (price != null) pricing.ModelPrice = price;
      if (inU != null && inU > 0) {
        pricing.ModelRatio = +(inU / 2).toFixed(8); // $/1M = 倍率 × 2
        if (outU != null) pricing.CompletionRatio = +(outU / inU).toFixed(8);
      }
      const btn = ed.querySelector("#pv-save"); btn.disabled = true;
      const d = await api("/api/option/model_pricing", { method: "PATCH", body: JSON.stringify({ changes: [{ model_name: entry.model_name, expected_version: entry.version || "", pricing }] }) });
      btn.disabled = false;
      if (d.success) { toast("已保存 🐾"); loadPricing(document.getElementById("tabbody")); }
      else toast(String(d.message || "保存失败").includes("changed") ? "配置已变化,已刷新,请重试" : d.message || "保存失败", 1);
      if (!d.success && String(d.message || "").includes("changed")) loadPricing(document.getElementById("tabbody"));
    };
  }

  function filterRows(inputId, tbodyId) {
    const inp = $(inputId); const tb = $(tbodyId);
    if (!inp || !tb) return;
    inp.oninput = () => {
      const kw = inp.value.trim().toLowerCase();
      [...tb.children].forEach((tr) => {
        if (!tr.dataset.q) return;
        tr.style.display = !kw || tr.dataset.q.includes(kw) ? "" : "none";
      });
    };
  }

  // ---------- 看板 ----------
  let dashDays = 7;
  const tip = document.createElement("div");
  tip.style.cssText = "position:fixed;z-index:99;background:#31283a;color:#fff;font-size:12px;padding:7px 11px;border-radius:9px;pointer-events:none;display:none;line-height:1.6;box-shadow:0 8px 20px rgba(0,0,0,.25)";
  document.body.appendChild(tip);
  async function loadDash(box) {
    if (!box.firstElementChild) box.innerHTML = `<div class="msg">加载中…</div>`;
    let d;
    try { d = await api("/mm-admin/stats?days=" + dashDays); }
    catch (e) { d = { success: false, message: "网络错误" }; }
    if (!d.success) { box.innerHTML = `<div class="msg err">${esc(d.message || "加载失败,请重新登录")}</div>`; return; }
    box.innerHTML = ""; // 数据已到手,此刻才替换旧卡(切换期间旧图表保持可见)
    const st = d.data;
    const card = document.createElement("div"); card.className = "card";
    const winLabel = dashDays >= 4000 ? "全部" : dashDays + " 天";
    const activeDays = (st.daily || []).length || 1;
    const tiles = [
      ["今日收入", "$" + st.today.usd.toFixed(2), st.today.calls + " 次调用 · " + st.today.users + " 活跃用户"],
      [`近 ${winLabel}收入`, "$" + st.range.usd.toFixed(2), st.range.calls + " 次调用 · " + st.range.users + " 活跃用户"],
      ["日均", "$" + (st.range.usd / activeDays).toFixed(2), `按有调用的 ${activeDays} 天折算`],
    ];
    card.innerHTML = `<div style="display:flex;gap:4px;background:#efeaf1;border-radius:10px;padding:3px;width:max-content;margin-bottom:14px" id="drange">
        ${[[7, "7 天"], [30, "30 天"], [365, "年"], [4000, "全部"]].map(([v, l]) => `<button data-d="${v}" class="rbtn" style="border:0;background:${dashDays === v ? "#fff" : "transparent"};color:${dashDays === v ? "#312b4f" : "#857f95"};border-radius:7px;padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:${dashDays === v ? "0 1px 4px rgba(49,43,79,.18)" : "none"}">${l}</button>`).join("")}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px">
      ${tiles.map(([t, v, sub]) => `<div style="border:1px solid var(--line);border-radius:13px;padding:14px;background:#fdfcfb">
        <div class="hint">${t}</div><div style="font-size:22px;font-weight:850;color:#312b4f;margin:3px 0">${v}</div><div class="hint">${sub}</div>
      </div>`).join("")}
    </div>
    <div class="hint" style="margin-bottom:6px"><b>收入走势</b>(悬停看明细${dashDays > 45 ? ",按月汇总" : ""})</div>
    <div id="chart" style="display:flex;align-items:flex-end;gap:${dashDays > 45 ? "6px" : "8px"};height:130px;padding:8px 4px 0"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px">
      <div><div class="hint" style="margin-bottom:6px"><b>模型 Top</b>(按收入)</div><table><thead><tr><th>模型</th><th>次数</th><th>收入</th></tr></thead><tbody id="tm"></tbody></table></div>
      <div><div class="hint" style="margin-bottom:6px"><b>渠道 Top</b>(按收入)</div><table><thead><tr><th>渠道</th><th>次数</th><th>收入</th></tr></thead><tbody id="tc"></tbody></table></div>
    </div>`;
    if (box.querySelector(".msg")) box.innerHTML = ""; // 清掉"加载中"占位
    box.appendChild(card);
    card.querySelectorAll("#drange .rbtn").forEach((b) => b.onclick = () => { dashDays = Number(b.dataset.d); loadDash(box); });
    // 超过 45 天按月聚合
    let series = st.daily || [];
    if (dashDays > 45) {
      const byMonth = {};
      series.forEach((x) => {
        const key = x.day.slice(0, 7); // YYYY-MM,跨年不混
        byMonth[key] = byMonth[key] || { day: key, calls: 0, usd: 0 };
        byMonth[key].calls += x.calls; byMonth[key].usd += x.usd;
      });
      series = Object.values(byMonth);
    } else {
      series = series.map((x) => ({ ...x, day: x.day.slice(5) })); // 显示 MM-DD
    }
    const max = Math.max(0.000001, ...series.map((x) => x.usd));
    const chart = card.querySelector("#chart");
    series.forEach((x) => {
      const col = document.createElement("div");
      col.style.cssText = `flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end`;
      const bar = document.createElement("div");
      const h = Math.max(3, (x.usd / max) * 88);
      bar.style.cssText = `width:100%;max-width:${dashDays > 45 ? 34 : 46}px;background:linear-gradient(180deg,#ffb28c,#ff8d6b);border-radius:6px 6px 0 0;height:${h}px;cursor:pointer`;
      const pv = document.createElement("div");
      pv.style.cssText = `font-size:${dashDays > 45 ? 9 : 10}px;color:#6b6577;font-weight:700;white-space:nowrap;margin-bottom:2px`;
      pv.textContent = x.usd >= 0.01 ? "$" + x.usd.toFixed(2) : (x.usd > 0 ? "¢" : "");
      col.appendChild(pv);
      bar.addEventListener("mousemove", (ev) => {
        tip.style.display = "block";
        tip.innerHTML = `<b>${esc(String(x.day))}</b><br>收入 $${x.usd.toFixed(4)} · ${x.calls} 次调用`;
        tip.style.left = Math.min(window.innerWidth - 170, ev.clientX + 12) + "px";
        tip.style.top = (ev.clientY - 54) + "px";
      });
      bar.addEventListener("mouseleave", () => tip.style.display = "none");
      const lb = document.createElement("div");
      lb.className = "hint"; lb.textContent = dashDays > 45 ? String(x.day) : x.day;
      col.appendChild(bar); col.appendChild(lb); chart.appendChild(col);
    });
    if (!series.length) chart.innerHTML = `<div class="msg" style="width:100%">该时间窗没有调用</div>`;
    const fill = (id, rows) => {
      const tb = card.querySelector(id);
      tb.innerHTML = rows.length ? rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td>${r.calls}</td><td>$${r.usd.toFixed(4)}</td></tr>`).join("") : `<tr><td colspan="3" class="msg">无数据</td></tr>`;
    };
    fill("#tm", st.by_model); fill("#tc", st.by_channel);
  }

  // ---------- 分组工作台 ----------
  let wbGroup = "default";
  async function wbData() {
    const [opt, chs, snap] = await Promise.all([
      api("/api/option/"),
      api("/api/channel/?p=1&page_size=100"),
      api("/api/option/model_pricing"),
    ]);
    const list = Array.isArray(opt.data) ? opt.data : (opt.data && opt.data.items) || [];
    const byKey = {}; list.forEach((o) => byKey[o.key] = o.value);
    let ratios = {}, usable = {};
    try { ratios = JSON.parse(byKey.GroupRatio || "{}"); } catch (_) {}
    try { usable = JSON.parse(byKey.UserUsableGroups || "{}"); } catch (_) {}
    const channels = (chs.data && (chs.data.items || chs.data) || []);
    if (!snap.success) throw new Error(snap.message || "定价数据加载失败");
    const cfgMap = {}; (snap.data.entries || []).forEach((e) => cfgMap[e.model_name] = e);
    return { ratios, usable, channels, cfgMap, emptyVer: snap.data.empty_version };
  }
  async function wbSetChannelGroups(c, groups) {
    const full = await api("/api/channel/" + c.id);
    if (!full.success) return { ok: false, msg: full.message || "读取渠道失败" };
    const ch = full.data;
    ch.group = [...new Set(groups)].join(",") || "default";
    delete ch.status; // 接口禁止携带 status 字段
    const d = await api("/api/channel/", { method: "PUT", body: JSON.stringify(ch) });
    return d.success ? { ok: true } : { ok: false, msg: d.message || "保存失败" };
  }
  async function loadWorkbench(box) {
    if (!box.firstElementChild) box.innerHTML = `<div class="msg">加载中…</div>`;
    let D;
    try { D = await wbData(); }
    catch (e) { box.innerHTML = `<div class="msg err">${esc(e.message || "加载失败")}</div>`; return; }
    if (!D.ratios[wbGroup]) wbGroup = Object.keys(D.ratios)[0] || "default";
    box.innerHTML = "";
    const card = document.createElement("div"); card.className = "card";
    const ratio = D.ratios[wbGroup] ?? 1;
    // 分组条
    const bar = document.createElement("div");
    bar.style.cssText = "display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:14px";
    Object.keys(D.ratios).forEach((g) => {
      const b = document.createElement("button");
      b.className = "btn " + (g === wbGroup ? "" : "ghost");
      b.style.height = "30px";
      b.textContent = `${D.usable[g] || g} ×${D.ratios[g]}`;
      b.onclick = () => { wbGroup = g; loadWorkbench(box); };
      bar.appendChild(b);
    });
    const edit = document.createElement("button"); edit.className = "btn ghost"; edit.style.height = "30px"; edit.textContent = "✎ 编辑本组";
    const addG = document.createElement("button"); addG.className = "btn ghost"; addG.style.height = "30px"; addG.textContent = "+ 新建分组";
    bar.appendChild(edit); bar.appendChild(addG);
    card.appendChild(bar);

    // 组内/组外渠道
    const inCh = D.channels.filter((c) => String(c.group || "default").split(",").map((x) => x.trim()).includes(wbGroup));
    const outCh = D.channels.filter((c) => !inCh.includes(c));
    const chHead = document.createElement("div");
    chHead.innerHTML = `<div class="hint" style="margin-bottom:8px"><b>「${esc(D.usable[wbGroup] || wbGroup)}」的渠道</b>(加入即代表该分组的用户会路由到这些上游;倍率 ×${ratio},本组用户按此折扣计费)</div>`;
    card.appendChild(chHead);
    const chList = document.createElement("div");
    chList.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-bottom:6px";
    inCh.forEach((c) => {
      const el = document.createElement("div");
      el.style.cssText = "border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fdfcfb;display:flex;align-items:center;gap:8px";
      const n = String(c.models || "").split(",").filter(Boolean).length;
      el.innerHTML = `<div style="min-width:0;flex:1"><b style="font-size:13px">${esc(c.name)}</b><div class="hint">${c.status === 1 ? "启用" : "停用"} · ${n} 个模型</div></div>`;
      const rm = document.createElement("button"); rm.className = "btn warn"; rm.style.height = "28px"; rm.textContent = "移出";
      rm.onclick = async () => {
        rm.disabled = true;
        const r = await wbSetChannelGroups(c, String(c.group || "default").split(",").map((x) => x.trim()).filter((g) => g !== wbGroup));
        rm.disabled = false;
        toast(r.ok ? `已把「${c.name}」移出 ${wbGroup}` : r.msg, !r.ok);
        if (r.ok) loadWorkbench(box);
      };
      el.appendChild(rm); chList.appendChild(el);
    });
    if (!inCh.length) chList.innerHTML = `<div class="hint">本组还没有渠道</div>`;
    card.appendChild(chList);
    const outRow = document.createElement("div");
    outRow.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px";
    outCh.forEach((c) => {
      const b = document.createElement("button"); b.className = "btn ghost"; b.style.height = "26px"; b.style.fontSize = "11px";
      b.textContent = "+ " + c.name;
      b.onclick = async () => {
        b.disabled = true;
        const r = await wbSetChannelGroups(c, [...String(c.group || "default").split(",").map((x) => x.trim()), wbGroup]);
        b.disabled = false;
        toast(r.ok ? `已把「${c.name}」加入 ${wbGroup}` : r.msg, !r.ok);
        if (r.ok) loadWorkbench(box);
      };
      outRow.appendChild(b);
    });
    card.appendChild(outRow);

    // 模型区:按渠道分子组
    const mh = document.createElement("div");
    mh.innerHTML = `<div class="hint" style="margin-bottom:8px"><b>本组模型</b>(按渠道分组;点击模型编辑定价;本组价 = 单价 × ${ratio})</div>`;
    card.appendChild(mh);
    const usd1m = (e, which) => {
      const c = (e.configured || {});
      const mr = typeof c.ModelRatio === "number" ? c.ModelRatio : null;
      const cr = typeof c.CompletionRatio === "number" ? c.CompletionRatio : null;
      if (mr == null) return null;
      return which === "in" ? mr * 2 : mr * 2 * (cr != null ? cr : 1);
    };
    const f = (v) => v == null ? "—" : "$" + (v >= 0.1 ? v.toFixed(2) : v.toPrecision(2));
    inCh.forEach((c) => {
      const models = String(c.models || "").split(",").map((x) => x.trim()).filter(Boolean);
      if (!models.length) return;
      const blk = document.createElement("div");
      blk.style.cssText = "border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fdfcfb";
      const head = document.createElement("div");
      head.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-bottom:6px";
      head.innerHTML = `<b style="font-size:13px">${esc(c.name)}</b><span class="hint">${models.length} 个模型 · ${c.status === 1 ? "启用" : "停用"}</span>`;
      blk.appendChild(head);
      const mtab = document.createElement("table");
      mtab.innerHTML = `<thead><tr><th>模型</th><th>输入价 $/1M</th><th>输出价 $/1M</th><th>本组输入价</th><th></th></tr></thead><tbody></tbody>`;
      const mtb = mtab.querySelector("tbody");
      models.sort().forEach((m) => {
        const e = D.cfgMap[m] || { model_name: m, version: D.emptyVer, configured: {} };
        const iu = usd1m(e, "in"), ou = usd1m(e, "out");
        const tr = document.createElement("tr");
        tr.style.cursor = "pointer";
        tr.innerHTML = `<td><b>${esc(m)}</b></td><td>${f(iu)}</td><td>${f(ou)}</td>
          <td style="color:#b04a2f;font-weight:700">${iu != null ? f(iu * ratio) : "—"}</td>
          <td style="text-align:right"><button class="btn warn" style="height:26px" title="从渠道移除该模型">×</button></td>`;
        tr.onclick = () => editPricing(e);
        tr.querySelector("button").onclick = async (ev) => {
          ev.stopPropagation();
          if (!confirm(`从「${c.name}」移除模型 ${m}?`)) return;
          const full = await api("/api/channel/" + c.id);
          if (!full.success) { toast(full.message || "读取渠道失败", 1); return; }
          const ch = full.data;
          ch.models = String(ch.models || "").split(",").map((x) => x.trim()).filter(Boolean).filter((x) => x !== m).join(",");
          delete ch.status;
          const d = await api("/api/channel/", { method: "PUT", body: JSON.stringify(ch) });
          toast(d.success ? `已移除 ${m}` : d.message || "失败", !d.success);
          if (d.success) loadWorkbench(box);
        };
        mtb.appendChild(tr);
      });
      blk.appendChild(mtab);
      card.appendChild(blk);
    });
    if (!inCh.some((c) => String(c.models || "").trim())) {
      const empty = document.createElement("div"); empty.className = "msg"; empty.textContent = "本组暂无模型(先加入渠道)";
      card.appendChild(empty);
    }
    const modelSet = new Map();

    // 添加模型到组内渠道
    const addM = document.createElement("div"); addM.className = "editor"; addM.style.marginTop = "14px";
    addM.innerHTML = `<div class="hint">往本组渠道追加模型(输入过滤候选;↻ 从上游实时拉取该渠道支持的模型)</div>
      <div class="row">
        <input id="wb-mn" list="wb-cand" placeholder="输入或选择模型…" style="flex:1;min-width:180px;height:32px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:13px">
        <datalist id="wb-cand"></datalist>
        <select id="wb-mc" style="height:32px;border:1px solid var(--line);border-radius:9px;padding:0 8px;font-size:12px">${inCh.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
        <button class="btn ghost" id="wb-fetch" style="height:32px">↻ 从上游拉取</button>
        <button class="btn" id="wb-madd" style="height:32px">追加</button>
      </div>`;
    card.appendChild(addM);
    const candEl = addM.querySelector("#wb-cand");
    const renderCand = (names) => {
      candEl.innerHTML = names.map((n) => `<option value="${esc(n)}"></option>`).join("");
    };
    const allModels = new Set();
    D.channels.forEach((c) => String(c.models || "").split(",").map((x) => x.trim()).filter(Boolean).forEach((m) => allModels.add(m)));
    renderCand([...allModels].sort());
    addM.querySelector("#wb-fetch").onclick = async () => {
      const cid = addM.querySelector("#wb-mc").value;
      const btn = addM.querySelector("#wb-fetch"); btn.disabled = true; btn.textContent = "拉取中…";
      const d = await api("/api/channel/fetch_models/" + cid);
      btn.disabled = false; btn.textContent = "↻ 从上游拉取";
      if (!d.success) { toast(d.message || "上游不支持模型列表查询", 1); return; }
      const list = (Array.isArray(d.data) ? d.data : (d.data && d.data.models) || []).map(String);
      if (!list.length) { toast("上游返回空列表", 1); return; }
      renderCand([...new Set(list)].sort());
      toast(`已拉取 ${list.length} 个候选模型 🐾`);
    };
    addM.querySelector("#wb-madd").onclick = async () => {
      const name = addM.querySelector("#wb-mn").value.trim();
      const cid = addM.querySelector("#wb-mc").value;
      if (!name || !cid) { toast("填模型名并选渠道", 1); return; }
      const c = inCh.find((x) => String(x.id) === String(cid));
      const full = await api("/api/channel/" + cid);
      if (!full.success) { toast("读取渠道失败", 1); return; }
      const ch = full.data;
      const cur = String(ch.models || "").split(",").map((x) => x.trim()).filter(Boolean);
      if (cur.includes(name)) { toast("该渠道已有此模型", 1); return; }
      ch.models = [...cur, name].join(",");
      delete ch.status;
      const d = await api("/api/channel/", { method: "PUT", body: JSON.stringify(ch) });
      toast(d.success ? `已把 ${name} 追加到「${c ? c.name : cid}」` : d.message || "失败", !d.success);
      if (d.success) loadWorkbench(box);
    };

    // 编辑本组 / 新建分组
    edit.onclick = () => {
      const er = document.createElement("div"); er.className = "editor"; er.style.marginBottom = "12px";
      er.innerHTML = `<div class="row">
        <label style="font-size:12px;color:var(--muted)">显示名<input id="wg-n" value="${esc(D.usable[wbGroup] || wbGroup)}" style="width:110px;margin-left:6px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:13px"></label>
        <label style="font-size:12px;color:var(--muted)">倍率<input id="wg-r" value="${D.ratios[wbGroup]}" style="width:80px;margin-left:6px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:13px"></label>
        <button class="btn" id="wg-save" style="height:32px">保存</button>
        <button class="btn warn" id="wg-del" style="height:32px">删除本组</button>
        <button class="btn ghost" id="wg-x" style="height:32px">取消</button>
      </div>`;
      card.insertBefore(er, bar.nextSibling);
      er.querySelector("#wg-x").onclick = () => er.remove();
      er.querySelector("#wg-save").onclick = async () => {
        const n = er.querySelector("#wg-n").value.trim(), r = Number(er.querySelector("#wg-r").value);
        if (!n || !(r > 0)) { toast("名称或倍率无效", 1); return; }
        D.usable[wbGroup] = n; D.ratios[wbGroup] = r;
        const r1 = await api("/api/option/", { method: "PUT", body: JSON.stringify({ key: "GroupRatio", value: JSON.stringify(D.ratios) }) });
        const r2 = await api("/api/option/", { method: "PUT", body: JSON.stringify({ key: "UserUsableGroups", value: JSON.stringify(D.usable) }) });
        toast(r1.success && r2.success ? "已保存 🐾" : "保存失败", !(r1.success && r2.success));
        if (r1.success && r2.success) loadWorkbench(box);
      };
      er.querySelector("#wg-del").onclick = async () => {
        if (!confirm(`删除分组 ${wbGroup}?(渠道不会被删,只是不再承接该组)`)) return;
        delete D.ratios[wbGroup]; delete D.usable[wbGroup];
        const r1 = await api("/api/option/", { method: "PUT", body: JSON.stringify({ key: "GroupRatio", value: JSON.stringify(D.ratios) }) });
        const r2 = await api("/api/option/", { method: "PUT", body: JSON.stringify({ key: "UserUsableGroups", value: JSON.stringify(D.usable) }) });
        if (r1.success && r2.success) { wbGroup = Object.keys(D.ratios)[0] || "default"; loadWorkbench(box); }
        else toast("删除失败", 1);
      };
    };
    addG.onclick = async () => {
      const g = prompt("新分组名(英文,如 pro)"); if (!g) return;
      if (D.ratios[g] != null) { toast("分组已存在", 1); return; }
      D.ratios[g] = 1; D.usable[g] = g;
      const r1 = await api("/api/option/", { method: "PUT", body: JSON.stringify({ key: "GroupRatio", value: JSON.stringify(D.ratios) }) });
      const r2 = await api("/api/option/", { method: "PUT", body: JSON.stringify({ key: "UserUsableGroups", value: JSON.stringify(D.usable) }) });
      if (r1.success && r2.success) { wbGroup = g; loadWorkbench(box); } else toast("创建失败", 1);
    };

    box.appendChild(card);
  }

  // ---------- 用户 ----------
  async function loadUsers(box, keyword) {
    box.innerHTML = `<div class="msg">加载中…</div>`;
    const q = keyword ? ("/api/user/search?keyword=" + encodeURIComponent(keyword)) : "/api/user/?p=1&page_size=100";
    const d = await api(q);
    if (!d.success) { box.innerHTML = `<div class="msg err">${esc(d.message || "加载失败")}</div>`; return; }
    const items = d.data && (d.data.items || d.data) || [];
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<div class="savebar" style="justify-content:flex-start;margin:0 0 12px">
        <input id="ukw" placeholder="输入即过滤用户…" value="${esc(keyword || "")}" style="height:34px;width:200px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:13px">
        <button class="btn ghost" id="ugo" style="height:34px">搜索</button>
        ${keyword ? '<button class="btn ghost" id="uall" style="height:34px">显示全部</button>' : ""}
      </div>
      <table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>余额</th><th>已用</th><th>注册</th><th style="text-align:right">操作</th></tr></thead><tbody id="urows"></tbody></table><div id="uedit"></div>`;
    if (box.querySelector(".msg")) box.innerHTML = ""; // 清掉"加载中"占位
    box.appendChild(card);
    card.querySelector("#ugo").onclick = () => { const v = card.querySelector("#ukw").value.trim(); loadUsers(box, v || null); };
    card.querySelector("#ukw").onkeydown = (e) => { if (e.key === "Enter") card.querySelector("#ugo").click(); };
    const all = card.querySelector("#uall"); if (all) all.onclick = () => loadUsers(box, null);
    const tb = card.querySelector("#urows");
    if (!items.length) tb.innerHTML = `<tr><td colspan="7" class="msg">没有用户</td></tr>`;
    const roleOf = (r) => r >= 100 ? "root" : r >= 10 ? "管理员" : "普通";
    const dt = (ts) => ts ? new Date(ts * 1000).toLocaleDateString("zh-CN") : "—";
    items.forEach((u) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><b>${esc(u.display_name || u.username)}</b><div class="hint">@${esc(u.username)}</div></td>
        <td>${roleOf(u.role)}</td>
        <td>${u.status === 1 ? '<span class="badge b-on">正常</span>' : '<span class="badge b-off">已封禁</span>'}</td>
        <td><b>$${(u.quota / 500000).toFixed(2)}</b></td>
        <td>$${((u.used_quota || 0) / 500000).toFixed(2)}</td>
        <td>${dt(u.created_at)}</td>
        <td><div class="ops" style="justify-content:flex-end">
          <button class="btn ghost u-top">充值</button>
          <button class="btn ${u.status === 1 ? "warn" : "ghost"} u-ban">${u.status === 1 ? "封禁" : "解封"}</button>
        </div></td>`;
      tr.querySelector(".u-top").onclick = () => topupUser(u);
      tr.querySelector(".u-ban").onclick = async (ev) => {
        if (u.role >= 100) { toast("root 账号不能封禁", 1); return; }
        const d2 = await api("/api/user/manage", { method: "POST", body: JSON.stringify({ id: u.id, action: u.status === 1 ? "disable" : "enable" }) });
        toast(d2.success ? (u.status === 1 ? "已封禁" : "已解封") : d2.message || "操作失败", !d2.success);
        if (d2.success) {
          const nowOn = u.status !== 1;
          u.status = nowOn ? 1 : 2;
          tr.children[2].innerHTML = nowOn ? '<span class="badge b-on">正常</span>' : '<span class="badge b-off">已封禁</span>';
          ev.target.textContent = nowOn ? "封禁" : "解封";
          ev.target.className = "btn " + (nowOn ? "warn" : "ghost") + " u-ban";
        }
      };
      tr.dataset.q = ((u.username || "") + " " + (u.display_name || "")).toLowerCase();
      tr.dataset.uid = u.id;
      tb.appendChild(tr);
    });
    filterRows("ukw", "urows");
  }
  async function topupUser(u) {
    const v = prompt(`给 ${u.display_name || u.username} 调整余额(美元,可负数;当前 $${(u.quota / 500000).toFixed(2)}):`, "");
    if (v == null) return;
    const usd = parseFloat(v);
    if (isNaN(usd) || usd === 0) { toast("金额无效", 1); return; }
    const t = await ensureToken(true);
    let d;
    try {
      const r = await fetch("/mm-admin/topup", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (t || "") }, body: JSON.stringify({ user_id: u.id, usd }) });
      d = await r.json().catch(() => ({ success: false, message: "服务无响应" }));
    } catch (_) { d = { success: false, message: "网络错误" }; }
    toast(d.success ? `已${usd > 0 ? "充值" : "扣除"} $${Math.abs(usd).toFixed(2)} 🐾(现 $${d.data.quota_usd.toFixed(2)})` : d.message || "失败", !d.success);
    if (d.success) {
      const tr = document.querySelector(`tr[data-uid="${u.id}"]`);
      if (tr) tr.children[3].innerHTML = `<b>$${d.data.quota_usd.toFixed(2)}</b>`;
    }
  }

  // ---------- 渠道 ----------
  async function loadChannels(box) {
    box.innerHTML = `<div class="msg">加载中…</div>`;
    const d = await api("/api/channel/?p=1&page_size=100");
    if (!d.success) { box.innerHTML = `<div class="msg err">${esc(d.message || "加载失败")}</div>`; return; }
    const items = d.data && (d.data.items || d.data) || [];
    if (!items.length) { box.innerHTML = `<div class="msg">还没有渠道</div>`; return; }
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<input id="ckw" placeholder="过滤渠道 / 分组 / 模型…" style="height:34px;width:260px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:13px;margin-bottom:10px"><table><thead><tr>
      <th>渠道</th><th>状态</th><th>分组</th><th>模型</th><th>已用</th><th>余额</th><th>优先级</th><th style="text-align:right">操作</th>
    </tr></thead><tbody id="rows"></tbody></table><div id="editor"></div>`;
    if (box.querySelector(".msg")) box.innerHTML = ""; // 清掉"加载中"占位
    box.appendChild(card);
    const tb = card.querySelector("#rows");
    const badge = (s) => s === 1 ? '<span class="badge b-on">启用</span>' : s === 3 ? '<span class="badge b-auto">自动禁用</span>' : '<span class="badge b-off">已禁用</span>';
    items.forEach((c) => {
      const tr = document.createElement("tr");
      const nModels = (c.models || "").split(",").filter(Boolean).length;
      tr.innerHTML = `<td><b>${esc(c.name)}</b></td>
        <td>${badge(c.status)}</td>
        <td style="font-size:12px;color:#6b6577">${esc(c.group || "default")}</td>\n        <td class="models-cell" title="${esc(c.models)}">${nModels} 个</td>
        <td>${usd(c.used_quota)}</td>
        <td>${c.balance != null && c.balance >= 0 ? usd(c.balance * 500000) : "—"}</td>
        <td>${c.priority ?? "—"}</td>
        <td><div class="ops" style="justify-content:flex-end">
          <button class="btn ghost act-status">${c.status === 1 ? "停用" : "启用"}</button>
          <button class="btn ghost act-bal" title="从上游查询余额">↻余额</button>
          <button class="btn act-edit">编辑模型</button>
        </div></td>`;
      tr.querySelector(".act-status").onclick = (ev) => toggleStatus(c, c.status !== 1 ? 1 : 2, tr, ev.target);
      tr.querySelector(".act-edit").onclick = () => editModels(c);
      tr.querySelector(".act-bal").onclick = async (ev) => {
        const b = ev.target; b.disabled = true; b.textContent = "…";
        const d = await api("/api/channel/update_balance/" + c.id);
        b.disabled = false; b.textContent = "↻余额";
        toast(d.success ? "已从上游更新余额" : d.message || "该渠道不支持余额查询", !d.success);
        if (d.success) boot();
      };
      tr.dataset.q = ((c.name || "") + " " + (c.group || "") + " " + (c.models || "")).toLowerCase();
      tb.appendChild(tr);
    });
    filterRows("ckw", "rows");
  }
  async function toggleStatus(c, status, tr, btn) {
    const d = await api("/api/channel/status/batch", { method: "POST", body: JSON.stringify({ ids: [c.id], status }) });
    toast(d.success ? `已${status === 1 ? "启用" : "停用"}「${c.name}」` : d.message || "操作失败", !d.success);
    if (d.success && tr) {
      c.status = status;
      tr.children[1].innerHTML = status === 1 ? '<span class="badge b-on">启用</span>' : status === 3 ? '<span class="badge b-auto">自动禁用</span>' : '<span class="badge b-off">已禁用</span>';
      btn.textContent = status === 1 ? "停用" : "启用";
    }
  }
  async function editModels(c) {
    const full = await api("/api/channel/" + c.id);
    if (!full.success) { toast(full.message || "读取渠道失败", 1); return; }
    const ch = full.data;
    const ed = $("editor") || document.createElement("div");
    ed.innerHTML = `<div class="editor">
      <div class="hint">「${esc(ch.name)}」 · 模型列表(英文逗号分隔,保存后立即生效)</div>
      <textarea id="mta">${esc(ch.models)}</textarea>
      <div class="hint" style="margin-top:10px">承接分组(逗号分隔;需与「下游分组」里的分组名一致,default 为默认)</div>
      <input id="mgrp" value="${esc(ch.group || "")}" placeholder="default" style="width:100%;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:13px">
      <div class="row">
        <button class="btn" id="msave">保存</button>
        <button class="btn ghost" id="mcancel">取消</button>
        <span class="hint">全量对象提交,其余字段保持原样</span>
      </div>
    </div>`;
    ed.querySelector("#mcancel").onclick = () => ed.innerHTML = "";
    ed.querySelector("#msave").onclick = async () => {
      ch.models = ed.querySelector("#mta").value.split(",").map((x) => x.trim()).filter(Boolean).join(",");
      if (!ch.models) { toast("模型列表不能为空", 1); return; }
      ch.group = ed.querySelector("#mgrp").value.split(",").map((x) => x.trim()).filter(Boolean).join(",") || "default";
      delete ch.status;
      const btn = ed.querySelector("#msave"); btn.disabled = true;
      const d = await api("/api/channel/", { method: "PUT", body: JSON.stringify(ch) });
      btn.disabled = false;
      toast(d.success ? "已保存" : d.message || "保存失败", !d.success);
      if (d.success) { ed.innerHTML = ""; boot(); }
    };
  }

  // ---------- 客户端模型配置 ----------
  const CLIENTS = [
    { key: "codex", title: "Codex", hint: "模型目录 + 默认模型", list: "codex", def: "codex_default" },
    { key: "grok", title: "Grok Build", hint: "模型目录 + 默认模型", list: "grok", def: "grok_default" },
    { key: "full", title: "OpenCode / OpenClaw / Hermes", hint: "共用一套全量模型 + 默认模型", list: "full", def: "full_default" },
    { key: "claude", title: "Claude Code", hint: "主力模型 + 后台小模型", list: null, def: "claude_main", extra: "claude_small", extraLabel: "后台小模型" },
  ];
  const DEFAULT_CFG = {
    codex: ["gpt-6.1-sol", "grok-latest", "glm-5.3", "MiniMax-M3"], codex_default: "gpt-6.1-sol",
    grok: ["grok-latest"], grok_default: "grok-latest",
    full: ["gpt-6.1-sol", "claude-opus-5-5", "grok-latest", "glm-5.3", "MiniMax-M3"], full_default: "gpt-6.1-sol",
    claude_main: "claude-opus-5-5", claude_small: "glm-5.3",
  };
  let cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));

  async function loadModelCfg(box) {
    try {
      const r = await fetch("/mm-admin/app-config");
      const d = await r.json();
      if (d.success && d.data) cfg = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)), d.data);
    } catch (_) {}
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<div class="hint" style="margin-bottom:12px">保存后立即下发到 <code>/app-config.json</code>,猫猫启动器下次启动(或重新接管)时自动采用,无需发版。</div><div class="client-grid" id="grid"></div>
    <div class="savebar"><button class="btn" id="save" style="height:38px;padding:0 22px">保存并下发</button></div>`;
    if (box.querySelector(".msg")) box.innerHTML = ""; // 清掉"加载中"占位
    box.appendChild(card);
    const grid = card.querySelector("#grid");
    CLIENTS.forEach((c) => {
      const el = document.createElement("div"); el.className = "client-card";
      el.innerHTML = `<h3>${c.title}</h3><div class="hint">${c.hint}</div>
        <div class="chips" data-list="${c.list || ""}"></div>`;
      const chips = el.querySelector(".chips");
      const renderChips = () => {
        chips.innerHTML = "";
        const list = c.list ? cfg[c.list] : [];
        list.forEach((m, i) => {
          const ch = document.createElement("span"); ch.className = "chip";
          ch.innerHTML = `${esc(m)}<span class="x" title="移除">×</span>`;
          ch.querySelector(".x").onclick = () => { cfg[c.list].splice(i, 1); renderChips(); renderSels(); };
          chips.appendChild(ch);
        });
        const add = document.createElement("input"); add.className = "adder"; add.placeholder = "+ 添加模型名,回车";
        add.onkeydown = (e) => { if (e.key === "Enter" && add.value.trim()) { cfg[c.list].push(add.value.trim()); add.value = ""; renderChips(); renderSels(); } };
        chips.appendChild(add);
      };
      const sels = document.createElement("div");
      const renderSels = () => {
        let h = "";
        const opts = (list, cur) => (list || []).map((m) => `<option value="${esc(m)}" ${m === cur ? "selected" : ""}>${esc(m)}</option>`).join("");
        if (c.list) h += `<div class="selrow">默认模型 <select data-k="${c.def}">${opts(cfg[c.list], cfg[c.def])}</select></div>`;
        else h += `<div class="selrow">主力模型 <select data-k="${c.def}">${opts(cfg.full, cfg[c.def])}</select>
          <br>${c.extraLabel} <select data-k="${c.extra}">${opts(cfg.full, cfg[c.extra])}</select></div>`;
        sels.innerHTML = h;
        sels.querySelectorAll("select").forEach((s) => s.onchange = () => cfg[s.dataset.k] = s.value);
      };
      renderChips(); renderSels();
      el.appendChild(sels);
      grid.appendChild(el);
    });
    card.querySelector("#save").onclick = async () => {
      const btn = card.querySelector("#save"); btn.disabled = true; btn.textContent = "保存中…";
      let d;
      try {
        const t = await ensureToken(true);
        const r = await fetch("/mm-admin/app-config", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (t || "") }, body: JSON.stringify(cfg) });
        d = await r.json().catch(() => ({ success: false, message: "保存服务无响应" }));
      } catch (e) { d = { success: false, message: "网络错误" }; }
      btn.disabled = false; btn.textContent = "保存并下发";
      toast(d.success ? "已保存并下发 🐾" : d.message || "保存失败", !d.success);
    };
  }

  try { TK = localStorage.getItem("mmAdminAt") || null; } catch (_) {}
  if (TK) boot(); else renderLogin();
})();
</script>
</body>
</html>
